# Только inpb.pro / www — остальные virtual host'ы nginx не затрагиваются.
# Боты (в т.ч. PR-CY: IP 87.228.72.128/25, UA с «PR-CY») здесь не фильтруются — allowlist при необходимости в Cloudflare.
# Установка: sudo cp deploy/nginx-inpb.pro.conf /etc/nginx/sites-available/inpb.pro
#            sudo ln -sf /etc/nginx/sites-available/inpb.pro /etc/nginx/sites-enabled/inpb.pro
#            sudo nginx -t && sudo systemctl reload nginx
#
# После выпуска сертификата certbot добавит блок listen 443 ssl и пути к PEM
# (или обновит этот файл — зависит от версии certbot).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name inpb.pro www.inpb.pro;

    # HTTP-01 challenge (на случай certonly --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3232;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
